[project]
name = "e2e"
version = "0.1.0"
description = "Сквозные сценарии против запущенного стенда (make dev-up)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "confluent-kafka>=2.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e"]
addopts = "-p no:cacheprovider"
