# Nginx — публичная точка входа: reverse proxy и балансировщик нагрузки перед api-gateway.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # Временные файлы — в /tmp: контейнер работает от непривилегированного пользователя
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Структурный access log в JSON (stdout контейнера)
    log_format json escape=json
        '{"time":"$time_iso8601","request_id":"$req_id","client":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_duration":"$upstream_response_time"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # X-Request-ID: берём от клиента или генерируем
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # DNS Docker: новые реплики gateway подхватываются без перезапуска Nginx
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_gateway {
        zone api_gateway 64k;
        least_conn;
        server api-gateway:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8080;

        client_max_body_size 1m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;

            proxy_connect_timeout 1s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # При падении реплики запрос уходит на соседнюю (POST/PATCH не повторяются)
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;
        }
    }
}
