name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-packages --locked
      - name: Ruff, format check, layer contracts
        run: make lint
      - name: Mypy
        run: make typecheck

  test:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - libs/events
          - libs/platform
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --all-packages --locked
      - name: Start Kafka and Schema Registry
        if: matrix.package == 'libs/events'
        run: docker compose up -d --wait kafka schema-registry
      - name: Unit and integration tests (coverage >= 80%)
        working-directory: ${{ matrix.package }}
        run: uv run pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Stop containers
        if: always() && matrix.package == 'libs/events'
        run: docker compose down

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --all-packages --no-dev --no-hashes --no-emit-workspace \
            --format requirements-txt --locked > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --disable-pip --no-deps --strict
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  docker:
    name: Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/orders-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.sha }}
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:main"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:main"
