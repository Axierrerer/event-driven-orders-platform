version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /auth-service
      - /user-service
      - /product-service
      - /inventory-service
      - /order-service
      - /notification-service
      - /api-gateway
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
