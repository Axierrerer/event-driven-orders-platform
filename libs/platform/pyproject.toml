[project]
name = "platform-lib"
version = "0.1.0"
description = "Общие механизмы сервисов: health, конфиг, логи, outbox, consumer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "events",
    "fastapi>=0.115",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "motor>=3.6",
    "redis>=5.2",
    "structlog>=24.4",
    "confluent-kafka>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-instrumentation-grpc>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-pymongo>=0.49b0",
]

[tool.uv.sources]
events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["unit", "integration"]

[tool.coverage.run]
# SQLAlchemy async выполняет код в greenlet, to_thread — в потоках
concurrency = ["greenlet", "thread"]
omit = ["src/worker.py"]  # точка входа фонового процесса, проверяется на стенде
