[project]
name = "events"
version = "0.1.0"
description = "Единый контракт событий Kafka: Pydantic-модели"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic[email]>=2.9,<3",
    "confluent-kafka[schemaregistry,json]>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["unit", "integration"]

[tool.coverage.run]
concurrency = ["thread"]
