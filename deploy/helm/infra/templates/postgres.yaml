apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_SUPERUSER_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
# Идемпотентно создаёт БД и роли сервисов (тот же скрипт, что и в docker-compose)
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "/scripts/postgres-init-databases.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_SUPERUSER_PASSWORD } }
            {{- range list "AUTH_DB_PASSWORD" "USERS_DB_PASSWORD" "INVENTORY_DB_PASSWORD" "ORDERS_DB_PASSWORD" }}
            - name: {{ . }}
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: {{ . }} } }
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap: { name: infra-scripts }
