# Самоподписанный CA (cert-manager) → сертификат для ingress
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orders-ca
spec:
  isCA: true
  commonName: orders-platform-local-ca
  secretName: orders-ca
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: Issuer }
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: orders-ca
spec:
  ca:
    secretName: orders-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tlsSecretName }}
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  dnsNames: [{{ .Values.ingress.host | quote }}]
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: orders-ca, kind: Issuer }
---
# Только TLS 1.3: подключения с TLS 1.2 и ниже отклоняются
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: tls13
spec:
  minVersion: VersionTLS13
