{{- if .Values.schemaInit.enabled }}
# Идемпотентная регистрация JSON Schema всех событий (образ gateway содержит libs/events)
apiVersion: batch/v1
kind: Job
metadata:
  name: schema-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: register
          image: {{ .Values.global.image.registry }}/orders-platform-api-gateway:{{ .Values.global.image.tag }}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "events.schemas_cli", "register", "--url", {{ .Values.global.schemaRegistryUrl | quote }}]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
